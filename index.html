<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>보니타샘</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --coral:   #FF6B9D;
      --rose:    #FF8FA3;
      --peach:   #FFB5A7;
      --lavender:#C77DFF;
      --violet:  #9B5DE5;
      --sky:     #A8DAFF;
      --gold:    #FFD166;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
      background: #0d0a14;
      font-family: 'Noto Serif KR', serif;
      color: #fff;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed; top: 0; left: 0; z-index: 9999;
      pointer-events: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--coral);
      transform: translate(-50%,-50%);
      transition: transform .1s, background .3s;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: fixed; top: 0; left: 0; z-index: 9998;
      pointer-events: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,107,157,.5);
      transform: translate(-50%,-50%);
      transition: transform .25s ease, border-color .3s;
    }

    /* ── Background canvas ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
    }

    /* ── Floating 보니타샘 particles ── */
    .particle-field {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      font-family: 'Noto Serif KR', serif;
      font-weight: 900;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      white-space: nowrap;
      animation: floatUp linear infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(var(--rot)) scale(var(--sc)); opacity: 0; }
      10%  { opacity: var(--op); }
      90%  { opacity: var(--op); }
      100% { transform: translateY(-100vh) rotate(calc(var(--rot) + 20deg)) scale(var(--sc)); opacity: 0; }
    }

    /* ── Main layout ── */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px;
    }

    /* ── Hero card ── */
    .card {
      position: relative;
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      padding: 64px 72px;
      max-width: 780px; width: 100%;
      text-align: center;
      box-shadow:
        0 0 80px rgba(255,107,157,.18),
        0 40px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.15);
      animation: cardIn 1.2s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(60px) scale(.95); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* glowing top line */
    .card::before {
      content: '';
      position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--coral), var(--lavender), var(--coral), transparent);
      animation: shimmer 3s linear infinite;
      background-size: 200% 100%;
    }
    @keyframes shimmer { to { background-position: 200% 0; } }

    /* ── Avatar ring ── */
    .avatar-wrap {
      width: 160px; height: 160px;
      margin: 0 auto 32px;
      position: relative;
      animation: avatarIn .8s .3s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes avatarIn {
      from { opacity: 0; transform: scale(.5) rotate(-15deg); }
      to   { opacity: 1; transform: scale(1)  rotate(0deg); }
    }
    .avatar-ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--coral), var(--lavender), var(--gold), var(--sky));
      padding: 3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #1a1226;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: contrast(1.15) saturate(1.3) brightness(1.05);
      image-rendering: crisp-edges;
    }

    /* ── Name ── */
    .name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      background: linear-gradient(135deg, var(--coral) 0%, var(--rose) 25%, var(--lavender) 55%, var(--sky) 80%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 300% 300%;
      animation: gradShift 5s ease infinite, nameIn .9s .5s cubic-bezier(.16,1,.3,1) both;
      letter-spacing: -0.02em;
    }
    @keyframes gradShift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes nameIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .name-sub {
      font-size: .95rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-top: 6px;
      animation: nameIn .9s .65s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Divider ── */
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, var(--coral), var(--lavender));
      border-radius: 999px;
      margin: 28px auto;
      animation: nameIn .9s .75s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Bio ── */
    .bio {
      font-size: 1.05rem;
      line-height: 1.85;
      color: rgba(255,255,255,.72);
      max-width: 520px; margin: 0 auto 36px;
      animation: nameIn .9s .85s cubic-bezier(.16,1,.3,1) both;
    }
    .bio strong {
      color: var(--peach);
    }

    /* ── Tags ── */
    .tags {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center;
      margin-bottom: 44px;
      animation: nameIn .9s .95s cubic-bezier(.16,1,.3,1) both;
    }
    .tag {
      padding: 7px 18px;
      border-radius: 999px;
      font-size: .82rem;
      letter-spacing: .06em;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.7);
      transition: all .3s;
    }
    .tag:hover {
      background: rgba(255,107,157,.15);
      border-color: var(--coral);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ── Music player ── */
    .music-wrap {
      animation: nameIn .9s 1.05s cubic-bezier(.16,1,.3,1) both;
    }
    .music-btn {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--coral), var(--violet));
      border: none; cursor: none;
      color: #fff;
      font-family: 'Noto Serif KR', serif;
      font-size: .95rem; font-weight: 700;
      letter-spacing: .05em;
      box-shadow: 0 8px 32px rgba(255,107,157,.35);
      transition: transform .25s, box-shadow .25s;
      position: relative; overflow: hidden;
    }
    .music-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,.12);
      opacity: 0;
      transition: opacity .3s;
    }
    .music-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(255,107,157,.5); }
    .music-btn:hover::after { opacity: 1; }
    .music-btn:active { transform: translateY(0); }

    .music-icon { font-size: 1.3rem; transition: transform .3s; }
    .music-btn.playing .music-icon { animation: pulse 1s ease infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.3);} }

    /* equalizer bars */
    .eq {
      display: flex; align-items: flex-end; gap: 2px; height: 16px;
    }
    .eq span {
      display: block; width: 3px; background: #fff; border-radius: 2px;
      animation: eqBar .8s ease infinite;
      height: 4px;
    }
    .eq span:nth-child(1){animation-delay:0s;    --h:14px;}
    .eq span:nth-child(2){animation-delay:.15s;  --h:10px;}
    .eq span:nth-child(3){animation-delay:.3s;   --h:16px;}
    .eq span:nth-child(4){animation-delay:.1s;   --h:8px;}
    .eq span:nth-child(5){animation-delay:.25s;  --h:12px;}
    @keyframes eqBar {
      0%,100%{height:4px;} 50%{height:var(--h);}
    }
    .eq.paused span { animation-play-state: paused; }

    .music-label { font-size: .85rem; margin-top: 10px; color: rgba(255,255,255,.35); }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 6px;
      opacity: .5; animation: fadeInUp 1s 2s both;
      font-size: .7rem; letter-spacing: .2em; color: rgba(255,255,255,.5);
    }
    .scroll-hint .arrow { animation: bounce 1.8s ease infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }
    @keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(10px);} to{opacity:.5;transform:translateX(-50%) translateY(0);} }

    /* ── Cherry blossoms ── */
    .sakura-field {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none; overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -40px;
      width: var(--size);
      height: var(--size);
      opacity: 0;
      animation: petalFall linear infinite;
      animation-duration: var(--dur);
      animation-delay: var(--delay);
    }
    .petal svg { width: 100%; height: 100%; }
    @keyframes petalFall {
      0%   { transform: translateY(0) rotate(0deg) translateX(0);   opacity: 0; }
      5%   { opacity: var(--op); }
      95%  { opacity: var(--op); }
      100% { transform: translateY(110vh) rotate(var(--spin)) translateX(var(--drift)); opacity: 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card { padding: 48px 28px; }
    }
  </style>
</head>

    <h1 class="name">보니타샘</h1>

<script>
/* ── Cursor ── */
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx=0, my=0, rx=0, ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cursor.style.left=mx+'px'; cursor.style.top=my+'px'; });
(function animRing(){
  rx += (mx-rx)*.13; ry += (my-ry)*.13;
  ring.style.left = rx+'px'; ring.style.top = ry+'px';
  requestAnimationFrame(animRing);
})();

/* ── Background canvas gradient mesh ── */
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
const orbs = [];

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#FF6B9D','#C77DFF','#FFB5A7','#A8DAFF','#FFD166','#9B5DE5'];
for(let i=0;i<6;i++){
  orbs.push({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: 250+Math.random()*300,
    vx:(Math.random()-.5)*.5,
    vy:(Math.random()-.5)*.5,
    color: COLORS[i]
  });
}

function drawBg(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0d0a14';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  orbs.forEach(o=>{
    o.x += o.vx; o.y += o.vy;
    if(o.x<-o.r||o.x>canvas.width+o.r) o.vx*=-1;
    if(o.y<-o.r||o.y>canvas.height+o.r) o.vy*=-1;

    const g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    g.addColorStop(0, o.color+'44');
    g.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* ── Floating 보니타샘 particles ── */
const field  = document.getElementById('particleField');
const texts  = ['보니타샘','Bonita','✦','♪','✿','보니타','샘'];
const tColors = [
  'linear-gradient(135deg,#FF6B9D,#FFB5A7)',
  'linear-gradient(135deg,#C77DFF,#A8DAFF)',
  'linear-gradient(135deg,#FFD166,#FF8FA3)',
  'linear-gradient(135deg,#9B5DE5,#FF6B9D)',
];

function spawnParticle(){
  const el = document.createElement('span');
  el.className = 'particle';
  const sz   = 10 + Math.random()*28;
  const rot  = (Math.random()-0.5)*30;
  const sc   = 0.7 + Math.random()*0.6;
  const op   = 0.06 + Math.random()*0.18;
  const dur  = 8 + Math.random()*14;
  const delay= Math.random()*8;

  el.textContent = texts[Math.floor(Math.random()*texts.length)];
  el.style.cssText = `
    left: ${Math.random()*100}%;
    bottom: -60px;
    font-size: ${sz}px;
    background-image: ${tColors[Math.floor(Math.random()*tColors.length)]};
    --rot: ${rot}deg;
    --sc: ${sc};
    --op: ${op};
    animation-duration: ${dur}s;
    animation-delay: ${delay}s;
  `;
  field.appendChild(el);
  setTimeout(()=>el.remove(), (dur+delay)*1000);
}

for(let i=0;i<30;i++) spawnParticle();
setInterval(spawnParticle, 600);

/* ── Cherry blossom petals ── */
const sakuraField = document.getElementById('sakuraField');

// SVG petal shapes (5-petal flower & single petal)
const petalShapes = [
  // 5-petal flower
  `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <g opacity="0.9">
      <ellipse cx="20" cy="10" rx="5" ry="9" fill="var(--pc)" transform="rotate(0,20,20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="9" fill="var(--pc)" transform="rotate(72,20,20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="9" fill="var(--pc)" transform="rotate(144,20,20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="9" fill="var(--pc)" transform="rotate(216,20,20)"/>
      <ellipse cx="20" cy="10" rx="5" ry="9" fill="var(--pc)" transform="rotate(288,20,20)"/>
      <circle cx="20" cy="20" r="4" fill="var(--pc2)"/>
    </g>
  </svg>`,
  // single leaf petal
  `<svg viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="15" cy="22" rx="10" ry="16" fill="var(--pc)" opacity="0.85" transform="rotate(-10,15,22)"/>
  </svg>`,
  // heart petal
  `<svg viewBox="0 0 32 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 26 C6 18 2 12 2 8 A6 6 0 0 1 16 6 A6 6 0 0 1 30 8 C30 12 26 18 16 26Z" fill="var(--pc)" opacity="0.8"/>
  </svg>`
];

const petalColors = [
  {pc:'#FFB7C5', pc2:'#FF8FA3'},
  {pc:'#FFC8D6', pc2:'#FF6B9D'},
  {pc:'#FFD6E0', pc2:'#FFB5A7'},
  {pc:'#F9A8D4', pc2:'#EC4899'},
  {pc:'#FBCFE8', pc2:'#FF6B9D'},
];

function spawnPetal() {
  const el = document.createElement('div');
  el.className = 'petal';

  const col   = petalColors[Math.floor(Math.random() * petalColors.length)];
  const shape = petalShapes[Math.floor(Math.random() * petalShapes.length)];
  const size  = 14 + Math.random() * 22;
  const dur   = 6 + Math.random() * 10;
  const delay = Math.random() * 10;
  const op    = 0.5 + Math.random() * 0.45;
  const spin  = (Math.random() - 0.5) * 720;
  const drift = (Math.random() - 0.5) * 200;

  el.innerHTML = shape
    .replace(/var\(--pc\)/g, col.pc)
    .replace(/var\(--pc2\)/g, col.pc2);

  el.style.cssText = `
    left: ${Math.random() * 105}%;
    --size: ${size}px;
    --dur: ${dur}s;
    --delay: ${delay}s;
    --op: ${op};
    --spin: ${spin}deg;
    --drift: ${drift}px;
    filter: drop-shadow(0 2px 4px rgba(255,107,157,.25));
  `;

  sakuraField.appendChild(el);
  setTimeout(() => el.remove(), (dur + delay) * 1000 + 500);
}

// Initial burst
for (let i = 0; i < 40; i++) spawnPetal();
setInterval(spawnPetal, 300);

/* ── Music toggle ── */
const audio = document.getElementById('bgAudio');
const btn   = document.getElementById('musicBtn');
const eq    = document.getElementById('eq');
const label = document.getElementById('musicLabel');
let playing = false;

function toggleMusic(){
  if(!playing){
    audio.play().then(()=>{
      playing = true;
      btn.classList.add('playing');
      eq.classList.remove('paused');
      label.textContent = '재생 중 ♪';
    }).catch(()=>{
      label.textContent = 'bg.mp3 파일을 확인해주세요';
    });
  } else {
    audio.pause();
    playing = false;
    btn.classList.remove('playing');
    eq.classList.add('paused');
    label.textContent = '음악 재생하기';
  }
}
</script>
</body>
